name: Android CI & Checklist Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression:
    name: regression
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Lint Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  observed-schema-upgrade:
    name: observed-schema-upgrade
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify Checklist Files & SQLite Schema
        run: |
          echo "### 📋 สถานะไฟล์ตามเกณฑ์ CS364 Assignment 2" >> $GITHUB_STEP_SUMMARY
          echo "| ไฟล์ที่ต้องมีตาม Checklist | ตำแหน่งที่ตรวจ | สถานะ |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          check_file() {
            if [ -f "$1" ]; then
              echo "| \`$2\` | \`$1\` | ✅ พบไฟล์แล้ว |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| \`$2\` | \`$1\` | ⏳ ยังไม่สร้าง |" >> $GITHUB_STEP_SUMMARY
            fi
          }

          check_file "app/src/main/java/com/example/ass2/MainActivity.java" "MainActivity.java (ข้อ 1-8)"
          check_file "app/src/main/java/com/example/ass2/DBHelper.java" "DBHelper.java (ข้อ 6-8: SQLite Schema)"
          check_file "app/src/main/java/com/example/ass2/ActivityAdapter.java" "ActivityAdapter.java (ข้อ 9-10)"
          check_file "app/src/main/res/layout/activity_main.xml" "activity_main.xml (หน้าหลัก)"
          check_file "app/src/main/res/layout/item_activity.xml" "item_activity.xml (ข้อ 9)"
          check_file "app/src/main/res/layout/dialog_activity_detail.xml" "dialog_activity_detail.xml (ข้อ 10)"
